components:
  schemas:
    LevelEnum:
      enum:
      - primary
      - gcse
      - alevel
      - university
      type: string
      description: |-
        * `primary` - Primary
        * `gcse` - GCSE
        * `alevel` - A-Level
        * `university` - University
    PatchedSubjectRW:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        level:
          $ref: '#/components/schemas/LevelEnum'
    PatchedTestModel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 1000
    PatchedTestModel2:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 1000
    PatchedTuteeProfileWrite:
      type: object
      properties:
        email:
          type: string
          format: email
          writeOnly: true
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
        learning_goals:
          type: string
        tutors:
          type: array
          items:
            type: string
            format: uuid
            nullable: true
        dob:
          type: string
          format: date
    PatchedTutorProfileWrite:
      type: object
      properties:
        email:
          type: string
          format: email
          writeOnly: true
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
        image:
          type: string
        education:
          type: string
          maxLength: 255
        hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        subjects:
          type: array
          items:
            type: string
            format: uuid
        tutees:
          type: array
          items:
            type: string
            format: uuid
        bio:
          type: string
          maxLength: 255
        dob:
          type: string
          format: date
